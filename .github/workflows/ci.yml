name: CI

# Fase 21 §19 — least-privilege: el token GITHUB_TOKEN solo necesita lectura
# del código para ejecutar lint/typecheck/test/build.
permissions:
  contents: read

on:
  push:
    branches: [main, develop]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      # Acciones pineadas a SHA inmutables para prevenir supply-chain attacks.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c448fc0a10 # v4.2.0
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm run db:generate -w packages/database

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # Domain tests use in-memory fakes — no database required.
      - name: Unit tests
        run: npm test

      - name: Build all apps
        run: npm run build --workspaces --if-present
