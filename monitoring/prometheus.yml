global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "sitedock-api"
    basic_auth:
      username: ${PROMETHEUS_USER:-admin}
      password: ${PROMETHEUS_PASSWORD:-changeme}
    static_configs:
      - targets: ["api:4000"]
    metrics_path: "/api/v1/admin/metrics"
    scrape_interval: 10s

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]

  - job_name: "prometheus"
    static_configs:
      - targets: ["prometheus:9090"]

remote_write: []
