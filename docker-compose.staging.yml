version: "3.9"

services:
  postgres:
    extends:
      file: docker-compose.yml
      service: postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sitedock_staging}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-sitedock_staging}

  api:
    extends:
      file: docker-compose.yml
      service: api
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sitedock_staging}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sitedock_staging}?schema=public
      NODE_ENV: staging
      PORT: 4000
      CORS_ORIGIN: ${CORS_ORIGIN}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN}
      COOKIE_SECURE: "false"
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stripe}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}
      DEMO_MODE: "true"
      BACKUP_RETENTION_DAYS: 7

  worker:
    extends:
      file: docker-compose.yml
      service: worker
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sitedock_staging}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-sitedock_staging}?schema=public
      NODE_ENV: staging
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-stripe}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY}
      STORAGE_PROVIDER: ${STORAGE_PROVIDER:-s3}
      S3_BUCKET: ${S3_BUCKET}
      S3_REGION: ${S3_REGION}
      S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID}
      S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-resend}
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM: ${RESEND_FROM}

  web:
    extends:
      file: docker-compose.yml
      service: web
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}

  dashboard:
    extends:
      file: docker-compose.yml
      service: dashboard
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}

  admin:
    extends:
      file: docker-compose.yml
      service: admin
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}

  caddy:
    extends:
      file: docker-compose.yml
      service: caddy
    volumes:
      - ./Caddyfile.staging:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

  prometheus:
    extends:
      file: docker-compose.yml
      service: prometheus

  otelcol:
    extends:
      file: docker-compose.yml
      service: otelcol

volumes:
  caddy_data:
  caddy_config:
